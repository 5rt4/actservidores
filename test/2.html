<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Control Display 7 Segmentos</title>

<style>
    body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.contenedor{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    text-align:center;
}

.display{
    margin-bottom:20px;
}

.display button{
    width:120px;
    height:45px;
    margin:5px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    cursor:pointer;
}

.display button:hover{
    background:#005ec4;
}

.teclado{
    display:grid;
    grid-template-columns:repeat(3,70px);
    gap:10px;
    justify-content:center;
}

.teclado button{
    width:70px;
    height:70px;
    font-size:24px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:white;
    cursor:pointer;
}

.teclado button:hover{
    background:#218838;
}
</style>
</style>

</head>
<body>

<div class="contenedor">

    <h2>Display de 7 Segmentos</h2>

    <div class="display">
        <a href="/ds1"><button>Display A</button></a>
        <a href="/ds2"><button>Display B</button></a>
    </div>

    <div class="teclado">
        <a href="/1"><button>1</button></a>
        <a href="/2"><button>2</button></a>
        <a href="/3"><button>3</button></a>

        <a href="/4"><button>4</button></a>
        <a href="/5"><button>5</button></a>
        <a href="/6"><button>6</button></a>

        <a href="/7"><button>7</button></a>
        <a href="/8"><button>8</button></a>
        <a href="/9"><button>9</button></a>

        <a href="/0"><button>0</button></a>
    </div>

</div>

</body>
</html>
