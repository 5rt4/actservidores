<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monitor Tensión</title>
<style>
  body {
    background-color: red;
    text-align: center;
  }

  .titulo {
    font-family: Courier, monospace;
    font-weight: bold;
    font-style: italic;
    font-size: 32px;
    text-transform: uppercase;
  }

  .borde {
    width: 170px;
    height: 100px;
    border: 5px solid black;
    border-radius: 18px;
    background-color: black;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pantalla {
    width: 160px;
    height: 90px;
    border: 1px solid black;
    border-radius: 10px;
    background-color: cyan;
    margin: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pantalla.apagada {
    background-color: black;
  }

  .boton {
    width: 80px;
    height: 45px;
    background-color: yellow;
    color: black;
    border: 2px solid black;
    border-radius: 80px;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <h1 class="titulo">Monitor Tensión</h1>

  <div class="borde">
    <div class="pantalla" id="pantalla">
      <span id="texto">&nbsp;&nbsp;Tensión: <strong id="valor">5.00</strong>V</span>
    </div>
  </div>

  <a href="/off"><button class="boton" id="botonToggle" onclick="toggleLed()">APAGAR</button></a>

  <script>
    let encendido = true;

    function toggleLed() {
      encendido = !encendido;
      const pantalla = document.getElementById('pantalla');
      const texto = document.getElementById('texto');
      const boton = document.getElementById('botonToggle');

      if (encendido) {
        pantalla.classList.remove('apagada');
        texto.style.visibility = 'visible';
        boton.textContent = 'APAGAR';
      } else {
        pantalla.classList.add('apagada');
        texto.style.visibility = 'hidden';
        boton.textContent = 'ENCENDER';
      }
    }
  </script>

</body>
</html>
